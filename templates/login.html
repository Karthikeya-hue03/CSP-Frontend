<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Infrastructure AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0b1e36 0%, #172554 50%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }
        .login-header {
            background-color: #0b1e36;
            color: #fff;
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
            position: relative;
        }
        .login-logo {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            margin-bottom: 0.8rem;
        }
        .quick-role-btn {
            font-size: 0.76rem;
            border-radius: 6px;
            padding: 0.35rem 0.6rem;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #334155;
            transition: all 0.2s;
        }
        .quick-role-btn:hover {
            background-color: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="login-logo">
            <i class="bi bi-buildings-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">Campus Infrastructure</h4>
        <p class="text-white-50 small mb-0">AI Health Monitoring & Predictive Maintenance</p>
    </div>

    <div class="p-4 p-md-5">
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small mb-4" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">Email or Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" name="email" value="{{ email or 'admin@campus.edu' }}" required autofocus placeholder="name@campus.edu">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" value="Admin@123" required placeholder="Enter password">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3" style="background-color: #1e3a8a; border-color: #1e3a8a;">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Dashboard
            </button>
        </form>

        <hr class="my-4 text-muted">

        <!-- 1-Click Demo Login Switcher -->
        <div>
            <p class="small text-muted fw-bold text-uppercase mb-2 text-center" style="font-size: 0.7rem; letter-spacing: 0.05em;">
                1-Click Demo Profiles
            </p>
            <div class="d-flex justify-content-between gap-1">
                <button type="button" class="quick-role-btn flex-fill text-center" onclick="fillCredentials('admin@campus.edu', 'Admin@123')">
                    <i class="bi bi-shield-lock-fill text-primary"></i> Admin
                </button>
                <button type="button" class="quick-role-btn flex-fill text-center" onclick="fillCredentials('staff@campus.edu', 'Staff@123')">
                    <i class="bi bi-tools text-warning"></i> Staff
                </button>
                <button type="button" class="quick-role-btn flex-fill text-center" onclick="fillCredentials('viewer@campus.edu', 'Viewer@123')">
                    <i class="bi bi-eye text-info"></i> Viewer
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function fillCredentials(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>

</body>
</html>
